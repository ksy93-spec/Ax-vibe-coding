name: robotaxi-probe
on:
  workflow_dispatch:
  push:
    paths:
      - kits/robotaxi-ax/sender/probe.mjs
      - .github/workflows/robotaxi-probe.yml
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
        working-directory: kits/robotaxi-ax/sender
      - run: xvfb-run -a node probe.mjs
        working-directory: kits/robotaxi-ax/sender
