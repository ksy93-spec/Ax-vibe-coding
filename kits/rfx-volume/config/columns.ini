; 조사기관 파일의 열 이름과 이 프로그램이 쓰는 항목을 연결합니다.
; 후보를 | 로 나눠 여러 개 적으면 파일에 있는 첫 번째 이름을 씁니다. 대소문자와 앞뒤 공백은 무시합니다.
; 실제 파일의 열 이름이 다르면 여기만 고치세요. 코드는 고칠 필요가 없습니다.

[columns]
; 필수
brand = Production Brand | Brand
nameplate = Production Nameplate | Global Nameplate | Nameplate
sop = SOP (Start of Production) | SOP | Start of Production
region = Production Region | Region | Source Plant Region
; 있으면 씀
strategic_group = Strategic Group | Manufacturer Group
eop = EOP (End of Production) | EOP | End of Production
platform = Platform | Global Platform
program = Program | Program Code
country = Country/Territory | Production Country | Country
plant = Production Plant | Plant

[volume]
; 연도별 생산량 열. 정규식이며 괄호 안이 연도입니다. 위에서부터 차례로 시도합니다.
year_1 = ^CY\s*(\d{4})$
year_2 = ^(\d{4})$
year_3 = ^(\d{4})\s*CY$
; 분기 열. (분기)(연도) 순서는 quarter_*_order 로 정합니다 (qy = 분기 먼저, yq = 연도 먼저).
; 연도 열이 비어 있는 해는 분기 합으로 채웁니다.
quarter_1 = ^Q([1-4])\s*(\d{4})$
quarter_1_order = qy
quarter_2 = ^(\d{4})\s*Q([1-4])$
quarter_2_order = yq
quarter_3 = ^CY\s*(\d{4})\s*Q([1-4])$
quarter_3_order = yq

[header]
; 머리글 행을 찾을 때 위에서부터 살펴볼 행 수
scan_rows = 30
