; 차량 물동 적정성 평가 설정. UTF-8 로 저장하세요.
; 이 파일을 고친 뒤에는 프로그램을 다시 시작해야 반영됩니다.

[server]
; 0.0.0.0 이면 같은 망의 다른 PC 가 이 PC 의 IP 로 접속할 수 있습니다.
; 이 PC 에서만 쓰려면 127.0.0.1 로 바꾸세요.
host = 0.0.0.0
port = 8765
; 시작할 때 이 PC 의 브라우저를 자동으로 엽니다 (yes / no)
open_browser = yes

[data]
; 조사기관 생산 전망 파일. 킷 폴더 기준 상대 경로 또는 절대 경로.
; 파일을 같은 이름으로 덮어쓰면 다음 요청 때 자동으로 다시 읽습니다.
file = data/sample-lvp.xlsx
; 시트 이름. 비우면 첫 번째 시트.
sheet =
; 화면과 보고서에 표시할 데이터 기준 시점. 비우면 파일 수정 날짜를 씁니다.
vintage =

[review]
; 고객 물동 입력 연도 범위
first_year = 2027
last_year = 2037
; 이 비율 안의 차이는 "적정" 으로 봅니다 (%)
tolerance = 10
; 금액 단위 표시 (판가 입력 통화)
currency = $
; 결과 보드 마지막 문장의 담당자. 비우면 "담당자" 로만 적습니다.
contact =
