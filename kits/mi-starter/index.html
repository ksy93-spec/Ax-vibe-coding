<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      흰 화면 대신 이유를 보여 주는 안내. 앱이 뜨면 저절로 사라집니다.
      - 이 원본 index.html 을 더블클릭한 경우: 빌드된 파일을 열라고 안내
      - 빌드된 파일인데 몇 초가 지나도 화면이 비어 있는 경우: 오류 문구와 브라우저 정보를 표시
      구형 브라우저에서도 돌도록 ES5 로만 씁니다.
    -->
    <div id="boot-msg" hidden style="max-width:640px;margin:48px auto;padding:24px;font:15px/1.7 'Malgun Gothic',sans-serif;border:1px solid #c3cad3;border-radius:12px;background:Canvas;color:CanvasText"></div>
    <script>
      (function () {
        var box = document.getElementById('boot-msg');
        var root = document.getElementById('root');
        var errors = [];
        function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
        function show(html) { box.innerHTML = html; box.hidden = false; }
        var source = document.querySelector('script[src*="/src/main."]');
        if (source && location.protocol === 'file:') {
          show('<b>이 파일은 개발용 원본이라 더블클릭으로는 열리지 않습니다.</b><br><br>' +
            '미리보기: 같은 폴더의 <code>demo\\index.html</code> 을 여세요.<br>' +
            '직접 빌드한 결과: <code>build.bat</code> 실행 후 <code>dist-single\\index.html</code><br>' +
            '개발 중 보기: <code>dev.bat</code> 실행 후 브라우저에서 <code>http://localhost:5173</code>');
          return;
        }
        window.addEventListener('error', function (e) { errors.push(e.message || String(e.error || e)); });
        var waited = 0;
        var timer = setInterval(function () {
          waited += 500;
          if (root && root.firstChild) { box.hidden = true; clearInterval(timer); return; }
          if (waited < 6000 || !box.hidden) return;
          var modern = window.CSS && CSS.supports && CSS.supports('color', 'oklch(0 0 0)');
          show('<b>화면을 그리지 못했습니다.</b><br><br>' +
            (modern ? '' : '이 브라우저는 너무 오래되었습니다. Chrome 또는 Edge 111 이상에서 여세요. 인터넷 익스플로러와 Edge 의 IE 모드는 안 됩니다.<br><br>') +
            '오류: ' + esc(errors.join(' / ') || '없음 (F12 콘솔을 확인하세요)') + '<br>' +
            '브라우저: ' + esc(navigator.userAgent) + '<br><br>' +
            '이 문구를 그대로 복사해 담당자에게 알려 주세요.');
        }, 500);
      })();
    </script>
  </body>
</html>
