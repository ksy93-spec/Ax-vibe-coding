# MI 포탈 실행기의 프로그램 목록. 포탈의 실행 단추는 여기 적힌 프로그램만 띄웁니다.
#
# 형식: id = 실행 파일 경로
#   - id 는 포탈 src/config/apps.ts 의 launchId 와 같아야 합니다. 영문 소문자, 숫자, - 만 씁니다.
#   - 경로는 .exe .lnk(바로 가기) .bat .cmd 만 됩니다.
#   - %USERPROFILE%, %LOCALAPPDATA% 같은 환경 변수와 공유 폴더(\\서버\폴더\...) 경로를 쓸 수 있습니다.
#   - # 으로 시작하는 줄은 설명입니다.
#
# 고친 뒤에는 register.bat 을 다시 실행해야 PC 에 반영됩니다.
# 메모장에서 저장할 때 인코딩은 UTF-8 로 둡니다.

# 아래 경로는 예시입니다. 실제 설치 위치로 바꾸세요.
nesting-calc = C:\Tools\NestingCalc\NestingCalc.exe
